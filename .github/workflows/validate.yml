name: Validate pack

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quest generator dependencies
        run: python -m pip install "pillow>=11,<13" "nbtlib>=2,<3"
      - name: Resolve mods and generate quests
        run: |
          python scripts/resolve_modrinth.py
          python scripts/pin_ftb_xmod.py
          python scripts/gen_quests.py
          python scripts/gen_menu.py
          python scripts/check_questbook.py
          python scripts/pack.py refresh
          python scripts/pack.py validate
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: Validate package creation
        run: python scripts/pack.py site
