name: Build GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pillow>=11,<13" "nbtlib>=2,<3"
      - run: |
          python scripts/resolve_modrinth.py
          python scripts/pin_ftb_xmod.py
          python scripts/gen_quests.py
          python scripts/gen_menu.py
          python scripts/check_questbook.py
          python scripts/pack.py refresh
          python scripts/pack.py validate
          python scripts/pack.py site
          mkdir -p dist
          cp site/latest/instance.zip dist/instance.zip
          cp site/latest/pack.mrpack dist/pack.mrpack
      - uses: actions/upload-artifact@v4
        with:
          name: pack-dist
          path: dist/
      - name: Release tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/instance.zip
            dist/pack.mrpack
