name: "1. Publish pack (GitHub Pages)"

# =============================================================================
#  На каждый push в main:
#    • пак пересобирается и публикуется на GitHub Pages (pack.toml + index.toml)
#    • туда же кладутся АРТЕФАКТЫ ПО СТАБИЛЬНЫМ АДРЕСАМ:
#         latest/instance.zip   <- для --import в Prism/Freesm
#         latest/pack.mrpack    <- для AstralRinth / Modrinth App
#      поэтому установщик всегда тянет самую свежую версию, и новый релиз
#      для обновления устанавливать НЕ нужно
#    • публикуются скрипты установщика (install.ps1 / install.sh / install.bat)
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PACKWIZ_JAVA: "21"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.PACKWIZ_JAVA }}

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve pack URL
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE="https://${OWNER}.github.io/${REPO}"
          echo "$BASE/pack.toml" > packsync/pack-url.txt
          echo "PACK_BASE=$BASE" >> "$GITHUB_ENV"
          echo "PACK_URL=$BASE/pack.toml" >> "$GITHUB_ENV"
          echo "::notice::Pack base = $BASE"

      - name: Refresh packwiz index
        run: packwiz refresh

      - name: Validate
        run: |
          python3 scripts/pw.py check
          python3 scripts/pw.py list

      - name: Stage Pages payload
        run: python3 scripts/pw.py site --out site

      - name: Build artifacts into site/latest
        run: |
          mkdir -p site/latest
          packwiz modrinth export -o site/latest/pack.mrpack -y
          python3 scripts/pw.py inject-packsync site/latest/pack.mrpack
          python3 scripts/pw.py instance --out site/latest/instance.zip
          ls -la site/latest/

      - name: Stamp installer base URL
        run: |
          for f in site/install.ps1 site/install.sh site/install.bat; do
            [ -f "$f" ] || continue
            sed -i "s|@@BASE_URL@@|${PACK_BASE}|g" "$f"
            echo "stamped $f -> ${PACK_BASE}"
          done
          grep -n "$PACK_BASE" site/install.ps1 | head -3 || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "### Модпак опубликован"
            echo ""
            echo "| Что | Адрес |"
            echo "|---|---|"
            echo "| pack.toml | \`${PACK_BASE}/pack.toml\` |"
            echo "| Установщик (Windows) | \`irm ${PACK_BASE}/install.ps1 ^| iex\` |"
            echo "| instance.zip (стабильный URL) | \`${PACK_BASE}/latest/instance.zip\` |"
            echo "| pack.mrpack (стабильный URL) | \`${PACK_BASE}/latest/pack.mrpack\` |"
            echo ""
            echo "Уже установленные инстансы обновятся сами при следующем запуске игры."
          } >> "$GITHUB_STEP_SUMMARY"
