name: Publish pack to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pack-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and package
        run: |
          python scripts/pack.py validate
          python scripts/pack.py site
      - name: Inspect build
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path("site/latest")
          with zipfile.ZipFile(p/"instance.zip") as z:
              assert "instance.cfg" in z.namelist()
              assert "mmc-pack.json" in z.namelist()
              assert "minecraft/packsync/packwiz-installer.jar" in z.namelist()
          with zipfile.ZipFile(p/"pack.mrpack") as z:
              d=json.loads(z.read("modrinth.index.json"))
              assert d["dependencies"]["neoforge"] == "21.1.252"
              assert "overrides/packsync/sync.cmd" in z.namelist()
          print("Distribution packages OK")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
